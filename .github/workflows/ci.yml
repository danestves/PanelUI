name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build library
        run: npm run build

      - name: CLI tests
        run: |
          if grep -R --include='*.test.mjs' -nE '\.only[[:space:]]*\(' packages/cli/test; then
            echo 'Focused tests are not allowed in CI.'
            exit 1
          fi
          node --test packages/cli/test/*.test.mjs
