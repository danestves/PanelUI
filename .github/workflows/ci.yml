name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build library
        run: npm run build

      - name: Node tests
        run: |
          # Discovered rather than globbed, so a workspace that grows its first
          # test directory is covered without anybody remembering to add it here.
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(
            find packages apps -path '*/test/*.test.mjs' -not -path '*/node_modules/*' | sort
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No test files found — the discovery pattern is wrong.'
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          if grep -l -E '\.only[[:space:]]*\(' "${files[@]}"; then
            echo 'Focused tests are not allowed in CI.'
            exit 1
          fi
          # Some tests import the library's .ts sources directly. Type stripping
          # is on by default from Node 22.18; the flag keeps earlier 22.x working.
          node --experimental-strip-types --test "${files[@]}"

      - name: Generated files are up to date
        run: |
          # The registry carries each component's source for the CLI to copy, so
          # a source change that skips regeneration ships the old code to
          # everyone installing that way while the npm package moves on.
          npm run docs:generate --workspace=docs
          if ! git diff --quiet; then
            echo 'Generated output does not match the source.'
            echo 'Run: npm run docs:generate --workspace=docs — and commit the result.'
            git diff --stat
            exit 1
          fi
